<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Residuos de Bolivia · {{ actual|capitalize }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="{{ actual }}" data-ciudad="{{ ciudad|default('') }}">
  <header>
    <h1>Residuos sólidos de Bolivia</h1>
    <nav>{% for id, url, nombre in paginas %}
      <a href="{{ url }}" {% if id == actual %}aria-current="page"{% endif %}>{{ nombre }}</a>{% endfor %}
    </nav>
    <span class="descargas">Datos:
      <a href="/api/descargar/ciudades.csv" title="Datos tratados con Cobija">CSV limpio</a>
      <a href="/api/descargar/ciudades.xlsx" title="Datos tratados con Cobija">Excel limpio</a>
      <a href="/api/descargar/ciudades.csv?crudo=1" title="Datos completos con Cobija, deduplicados y renombrados">CSV crudo</a>
    </span>
    <button id="imprimir" class="tema" type="button" title="Imprimir esta página">Imprimir</button>
    <button id="tema" class="tema" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Cambiar tema">◐</button>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
  <footer>Fuente: INE y Gobiernos Autónomos Municipales. Toneladas recolectadas; (p) = preliminar. El Total nacional del INE incluye Cobija.</footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
