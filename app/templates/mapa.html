{% extends "base.html" %}
{% block contenido %}
<section class="card">
  <h2>Recolección de residuos por ciudad</h2>
  <div class="controles">
    <label>Año <select id="anio" disabled></select></label>
    <label class="toggle"><input id="compararMapa" type="checkbox" disabled> Colorear el cambio frente al año anterior</label>
  </div>
  <p id="estadoMapa" class="nota" role="status">Cargando mapa…</p>
  <div class="mapa-contenido">
    <figure class="grafica mapa-figura">
      <svg id="mapa" viewBox="0 0 520 560" role="group" aria-label="Mapa de recolección en Bolivia con enlaces a informes por ciudad"></svg>
      <div id="leyenda-mapa"></div>
      <figcaption>El tamaño de cada círculo representa las toneladas registradas. Selecciona un círculo para abrir el reporte de la ciudad.</figcaption>
    </figure>
    <section class="mapa-detalle" id="detalleMapa" aria-labelledby="tituloDetalleMapa" hidden>
      <h3 id="tituloDetalleMapa">Detalle por ciudad</h3>
      <label for="ciudadMapa">Ciudad <select id="ciudadMapa"></select></label>
      <div class="mapa-ficha" aria-live="polite" aria-atomic="true">
        <p id="periodoMapa" class="mapa-periodo"></p>
        <dl class="mapa-indicadores">
          <div class="kpi"><dt class="titulo-tarjeta">Toneladas recolectadas</dt><dd id="toneladasMapa"></dd></div>
          <div class="kpi"><dt class="titulo-tarjeta">Del total nacional</dt><dd id="participacionMapa"></dd></div>
          <div class="kpi"><dt class="titulo-tarjeta">Puesto en el ranking</dt><dd id="puestoMapa"></dd></div>
          <div class="kpi"><dt class="titulo-tarjeta" id="tituloVariacionMapa">Variación interanual</dt><dd id="variacionMapa"></dd></div>
        </dl>
        <p id="notaDetalleMapa" class="nota"></p>
      </div>
      <a class="mapa-reporte" id="reporteMapa" href="#">Abrir reporte de la ciudad</a>
    </section>
  </div>
</section>
{% endblock %}
